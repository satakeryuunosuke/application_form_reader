<!DOCTYPE html>
<html lang="ja">
<head>
  <meta charset="UTF-8">
  <title>Calibrator Success Preview</title>
  <link rel="stylesheet" href="../css/variables.css">
  <link rel="stylesheet" href="../css/base.css">
  <link rel="stylesheet" href="../css/components.css">
  <link rel="stylesheet" href="../css/pages.css">
  <script src="../lib/dexie.min.js"></script>
  <script src="../lib/xlsx.full.min.js"></script>
  <script src="../lib/pdf.min.js"></script>
  <script src="../lib/zxing-library.min.js"></script>
</head>
<body style="background: #1e293b; padding: 30px; display: flex; justify-content: center;">
  <div style="background: #ffffff; border-radius: 12px; width: 1350px; max-width: 96vw; padding: 24px; box-shadow: 0 10px 25px rgba(0,0,0,0.2);">
    <div style="display: flex; align-items: center; justify-content: space-between; margin-bottom: 16px; border-bottom: 1px solid var(--gray-200); padding-bottom: 12px;">
      <h3 style="margin: 0; font-size: 1.1rem; font-weight: 700;">新規プロジェクト作成 (Step 3 / 3: 受講票書式設定)</h3>
      <span class="badge badge-success" style="font-size: 0.85rem;">🏷️ バーコード: TDN60013 (傾き: +1.2°)</span>
    </div>
    <div id="calib-mount"></div>
  </div>

  <script type="module">
    import { TemplateCalibrator } from '../js/components/calibrator.js';

    const mount = document.getElementById('calib-mount');
    const calib = new TemplateCalibrator(mount);

    // わずかに傾き（1.2度）のある帳票としてシミュレーション描画
    if (calib.barcodeBox) {
      calib.barcodeBox.angle = 1.2 * Math.PI / 180;
      calib.barcodeBox.angleDeg = 1.2;
      calib.loadedPages[0].barcodeBox = calib.barcodeBox;
      calib.updatePaginationUI();
      calib.drawOverlay();
    }
  </script>
</body>
</html>
