<!DOCTYPE html>
<html lang="ja">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>受講確認票 処理システム | 完全ローカル運用</title>
  <meta name="description" content="学習塾の期間講習（夏期・冬期・春期）および通常授業（前期・後期）受講確認票・申込書のスキャン集計および承認管理システム。外部通信を行わない完全クライアントサイド動作。">

  <!-- Fonts (Online + Local Fallback) -->
  <link rel="preconnect" href="https://fonts.googleapis.com">
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
  <link href="https://fonts.googleapis.com/css2?family=Inter:wght@400;500;600;700;800&family=JetBrains+Mono:wght@500;700&family=Noto+Sans+JP:wght@400;500;700;800&display=swap" rel="stylesheet">

  <!-- CSS Stylesheets -->
  <link rel="stylesheet" href="css/variables.css?v=1.6.4">
  <link rel="stylesheet" href="css/base.css?v=1.6.4">
  <link rel="stylesheet" href="css/components.css?v=1.6.4">
  <link rel="stylesheet" href="css/pages.css?v=1.6.4">

  <!-- Global Error Trap for Bootstrap -->
  <script>
    window.addEventListener('error', function(e) {
      const c = document.getElementById('app-content');
      if (c && c.innerHTML.includes('アプリケーションを読み込み中')) {
        c.innerHTML = `
          <div class="card" style="margin: 40px auto; max-width: 600px; text-align: center; border-color: var(--danger-solid);">
            <h3 style="color: var(--danger-solid); margin-bottom: 8px;">⚠️ アプリケーション起動エラー</h3>
            <p style="color: var(--gray-700); font-size: 0.9rem; margin-bottom: 12px;">${e.message || 'スクリプトの実行中にエラーが発生しました'}</p>
            <div style="font-family: var(--font-mono); font-size: 0.78rem; color: var(--gray-500); background: var(--gray-100); padding: 8px; border-radius: var(--radius-sm); word-break: break-all;">
              ${e.filename ? e.filename.split('/').pop() : ''}:${e.lineno || 0}
            </div>
            <button class="btn btn-primary btn-sm" style="margin-top: 16px;" onclick="location.reload(true);">ページの再読み込み（キャッシュ更新）</button>
          </div>
        `;
      }
    });
  </script>

  <!-- Local Libraries (No External Network Dependencies) -->
  <script src="lib/dexie.min.js"></script>
  <script src="lib/pdf.min.js"></script>
  <script src="lib/zxing-library.min.js"></script>
  <script src="lib/xlsx.full.min.js"></script>

  <!-- Application Entry Point (ES Modules) -->
  <script type="module" src="js/app.js?v=1.7.0"></script>
</head>
<body>
  <!-- Header Bar -->
  <header class="app-header">
    <a href="#home" class="header-brand brand">
      <span class="brand-icon">📑</span>
      <div style="display: flex; align-items: center; gap: 8px;">
        <div class="brand-title">受講確認票 集計管理</div>
        <span class="brand-version" id="header-app-version">v1.7.0</span>
        <span id="header-sync-indicator" class="badge badge-gray" style="font-size: 0.72rem; padding: 2px 6px; cursor: pointer;" title="共有フォルダ接続状態（クリックで設定へ）">⚪ ローカル</span>
      </div>
    </a>

    <nav class="header-nav">
      <a href="#home" class="nav-link" id="nav-home">
        <span>📋</span> プロジェクト一覧
      </a>
      <a href="#settings" class="nav-link" id="nav-settings">
        <span>⚙️</span> 設定
      </a>
    </nav>
  </header>

  <!-- Main Content View Container -->
  <main class="app-main" id="app-content">
    <div style="text-align: center; padding: 60px 20px; color: var(--gray-500);">
      アプリケーションを読み込み中...
    </div>
  </main>
</body>
</html>
